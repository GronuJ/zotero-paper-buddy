name: Release

# Publish a release by pushing a tag like v0.6.1, or by publishing a release
# with that tag on GitHub. Either way this builds the .xpi and update.json and
# attaches them to the release. Installed copies pick it up through the
# update_url in addon/manifest.json, which points at the update.json of the
# latest release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./addon/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      - name: Create the release or add the files to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/*.xpi build/update.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.xpi build/update.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
