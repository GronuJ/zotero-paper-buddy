name: Release

# Push a tag like v0.6.1 to publish a release. Installed copies pick it up
# through the update_url in addon/manifest.json, which points at the
# update.json attached to the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./addon/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.xpi build/update.json --title "$GITHUB_REF_NAME" --generate-notes
